# yaml-language-server: $schema=../../schemas/plan.schema.json
# Custom graph. research-report has no human gate. announcement is a publish
# graph. Neither fits a launch where every external send, submission, account,
# and signature stops for Alfonso. Bots draft. The private 90-day notes stay
# in github.com/devopsfortunato/swiss-consulting. This file stays generic.
schema_version: 1
plan_id: swiss-consulting-2026-10
version: 1
title: Ticino IT consulting launch
priority: 1
goal: >
  Launch solo IT consulting in Ticino over 90 days. File the migration
  office email and the contract and conflict check that Alfonso already
  finished on 24 Oct 2026. Compare payrolling with MITC, PayrollPlus,
  Helvetic Payroll, and Diligo. Publish anonymized case studies and a
  consulting CV. Draft outreach to Swisslinx, Nicoll Curtin, Hays, and
  Bosshard & Partner. Run the daily contract search and the Lugano meetup
  search, and feed both to Consulting Planner. Consulting Tracker keeps
  the log. Take the first mission through an umbrella company or a broker.
  Open an Einzelfirma only for the second client. Bots draft. Alfonso
  sends, submits, opens accounts, and signs. Call the employer the current
  employer. Leave client names and client figures out of this repo.
owner: orchestrator
definition_of_done: >
  migration_office_record.md and contract_conflict_check.md record the
  24 Oct 2026 work. payrolling_simulations.md covers MITC, PayrollPlus,
  Helvetic Payroll, and Diligo. payrolling_decision.md, broker_send_record.md,
  first_mission_record.md, einzelfirma_decision.md, and follow_up_record.md
  each record Alfonso's sent, submitted, opened, signed, or hold decision.
  case_studies.md and consulting_cv.md stay anonymized, and
  positioning_review.md says pass or fail. contract_leads.md and
  meetup_leads.md are the feeds. tracker_log.md is the source of truth for
  outreach and submissions. monday_status.md is the Monday note. The first
  mission record uses an umbrella company or a broker. The Einzelfirma
  record stays on hold until a second client exists.
budget:
  tokens: 1000000
  hours: 50
  usd: 0
human_approval_policy: >
  Every email, submission, account, and signature needs Alfonso. Bots draft
  and stop. While he has not approved, do not send, submit, open an account,
  or sign. The safe default is hold. The Monday status is the note in this
  plan. It is not mail to a firm, a broker, or an office. Changing the goal,
  the current-employer constraint, or the deadline also needs a person.
  Artifacts in this repo call the employer the current employer and leave
  out client names and client figures.
constraints:
  deadline: "2027-01-22T17:00:00+01:00"
  max_parallel: 3
  schedule_origin: "2026-10-24T09:00:00+02:00"
provided_inputs:
  - artifact: consulting_context.md
    description: >
      Launch context for Ticino. The detailed 90-day notes stay in the
      private repo github.com/devopsfortunato/swiss-consulting. This public
      plan calls the employer the current employer and does not copy a
      client name or a client figure.
deliverables:
  - migration_office_record.md
  - contract_conflict_check.md
  - payrolling_simulations.md
  - payrolling_decision.md
  - case_studies.md
  - consulting_cv.md
  - positioning_review.md
  - contract_leads.md
  - meetup_leads.md
  - broker_drafts.md
  - broker_send_record.md
  - first_mission_draft.md
  - first_mission_record.md
  - einzelfirma_draft.md
  - einzelfirma_decision.md
  - tracker_log.md
  - follow_up_drafts.md
  - follow_up_record.md
  - monday_status.md
