      out client names and client figures. Do not send another email.
    inputs:
      - artifact: consulting_context.md
    outputs:
      - artifact: migration_office_record.md
        type: markdown
    depends_on: []
    estimate_hours:
      optimistic: 0.5
      likely: 1
      pessimistic: 1.5
    required_capabilities:
      - gmail_tracking
    assignee: consulting-tracker
    acceptance_criteria:
      - migration_office_record.md states that the migration office email was sent on 24 Oct 2026.
