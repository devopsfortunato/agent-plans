# Agent roster. The Planner assigns tasks; the CLI only checks the assignment.
# capacity is how many tasks that bot may run at the same time.
#
# Role mapping for this fork:
# - orchestrator and planner stay dedicated seats. Agent planner Searcher
#   staffs both. The names stay because upstream plans set owner: orchestrator
#   and the contract keeps "shapes the ask" separate from "writes plan.yaml".
#   The same bot is also listed as agent-planner-searcher for general work.
# - accuracy stays a dedicated verifier. attest-done records reviewer accuracy,
#   and none of the owner's bots is a verifier.
# - human stays the approval seat for irreversible gates.
# - The "Upstream example roles" block is the original fleet. examples/ and
#   plans/2026-10-08-product-announcement still assign those names.
# yaml-language-server: $schema=schemas/roster.schema.json
schema_version: 1
default_max_parallel: 3
bots:
  - name: orchestrator
    description: >
      First contact. Shapes the ask and dispatches work. Does not write
      plan.yaml. This seat is staffed by Agent planner Searcher.
    capabilities:
      - intake
      - coordination
      - dispatch
    capacity: 2
  - name: planner
    description: >
      Single writer of plan.yaml. Decomposes work, estimates, assigns, and
      replans. This seat is staffed by Agent planner Searcher. It is a
      separate roster name so the orchestrator still does not write the plan.
    capabilities:
      - planning
      - estimation
      - scheduling
    capacity: 1
  - name: accuracy
    description: >
      Verifier. The only bot that may decide a task is done. Kept as its own
      seat because attest-done requires reviewer accuracy. No owner bot fills
      this role.
    capabilities:
      - verification
      - fact_check
    capacity: 2
  - name: human
    kind: human
    description: Approval gates. Not a bot. Assign milestones that need a person here.
    capabilities:
      - human_approval
    capacity: 1

  # Owner's fleet. Names are the kebab-case ids plans assign.
  - name: agent-planner-searcher
    description: >
      General assistant. Same person as the orchestrator and planner seats:
      shapes asks, drafts plans, and picks up research that has no specialist.
    capabilities:
      - intake
      - coordination
      - dispatch
      - planning
      - estimation
      - scheduling
      - research
      - synthesis
    capacity: 2
  - name: grok-bot
    description: General teammate for research, writing, and coordination when no specialist owns the task.
    capabilities:
      - research
      - synthesis
      - long_form_writing
      - coordination
    capacity: 2
  - name: job-hunter
    description: >
      Finds DevSecOps, Kubernetes, platform, and cloud engineering roles in
      Switzerland and screens them against the permit and salary floor.
    capabilities:
      - job_search
      - role_screening
    capacity: 1
  - name: tailor
    description: Rewrites the CV and cover letter for one specific posting. One tailoring job at a time.
    capabilities:
      - cv_writing
      - cover_letter
    capacity: 1
  - name: applier
    description: >
      Applier (Grok Bot id 8fd043c0-ef1e-4176-98df-1a817ba02a0f). Fills in
      job application forms in the browser from the tailored CV and cover
      letter. Always stops before the final submit for Alfonso's review,
      and submits only after his explicit approval. Never emails anyone
      and never creates accounts.
    capabilities:
      - form_filling
      - browser_operation
      - application_submit
    capacity: 1
  - name: application-tracker
    description: >
      Application Tracker. Tracks every job application and its status.
      The single source of truth for application state.
    capabilities:
      - application_tracking
      - status_reporting
    capacity: 1
  - name: searcher
    description: General research. Company briefs, sources, and synthesis.
    capabilities:
      - research
      - synthesis
      - company_research
    capacity: 2
  - name: news-hunter
    description: Monitors news for companies, markets, and topics the team is already tracking.
    capabilities:
      - news_monitoring
      - research
    capacity: 2
  - name: email-checker
    description: Triages the inbox and summarizes what needs a reply. Does not send mail.
    capabilities:
      - inbox_triage
      - email_summary
    capacity: 1
  - name: github-jedi
    description: GitHub work. Issues, pull requests, and code review.
    capabilities:
      - coding
      - github
      - code_review
    capacity: 2
  - name: sniper
    description: Watches a named hardware target and flags a listing that hits the target price.
    capabilities:
      - deal_watching
      - price_tracking
    capacity: 1
  - name: prices-hunter
    description: >
      Compares hardware prices across retailers. Broader than sniper, which
      watches one target. The display name is PRices Hunter.
    capabilities:
      - price_tracking
      - comparison_shopping
      - deal_watching
    capacity: 2
  - name: chat-hunter-x
    description: Watches X (Twitter) for posts the team asked it to follow.
    capabilities:
      - x_monitoring
      - social_research
    capacity: 1
  - name: youtube-summarized
    description: Summarizes YouTube videos into a short note with the claims and the timestamps.
    capabilities:
      - video_summary
      - synthesis
    capacity: 2
  - name: locally
    description: Plans and reviews coding jobs that a local model will run.
    capabilities:
      - coding
      - local_planning
      - code_review
    capacity: 1
  - name: dr-eggbot
    description: Designs new bots. Writes the role, the capabilities, and the instructions. Display name is dr eggbot.
    capabilities:
      - bot_design
      - instruction_review
    capacity: 1
  - name: consulting-planner
    description: >
      Consulting Planner (Grok Bot id 46dc6a74-1ada-476e-a42d-f092e28f2348).
      Lead for the Ticino consulting launch. Runs the 90-day plan from the
      private repo github.com/devopsfortunato/swiss-consulting, sends the
      weekly status every Monday, and drafts outreach. Mail to a firm, a
      broker, or an office, plus any account or signature, stays with Alfonso.
    capabilities:
      - launch_planning
      - record_keeping
      - payrolling_research
      - positioning
      - outreach_drafting
      - mission_drafting
      - weekly_status
    capacity: 1
  - name: consulting-tracker
    description: >
      Consulting Tracker (Grok Bot id f1f22036-c6a3-4d56-95ea-e5cb548850ec).
      Reads Gmail to track outreach to brokers, payrolling firms, and the
      migration office, plus contract submissions. Flags replies and due
      follow-ups daily at 18:00. Does not send mail.
    capabilities:
      - gmail_tracking
      - follow_up_tracking
    capacity: 1
  - name: contract-hunter
    description: >
      Contract Hunter (Grok Bot id 0ff0e5e5-dbea-4631-aa0d-5a0ecf692ce0).
      Runs the daily contract-role search at 9:30.
    capabilities:
      - contract_search
    capacity: 1
  - name: meetup-scout
    description: >
      Meetup Scout (Grok Bot id 9b509c74-d9b9-4b52-a020-1f7bc79d99d8).
      Runs the daily search at 9:45 for tech and networking events near
      Lugano.
    capabilities:
      - event_search
    capacity: 1

  # Upstream example roles. Kept so examples/ and the product-announcement
  # plan still validate. Not part of the owner's fleet.
  - name: research
    description: Finds facts, positioning, and sources, and writes research briefs.
    capabilities:
      - research
      - synthesis
    capacity: 1
  - name: creative-director
    description: Visual direction and image creation.
    capabilities:
      - visual_design
      - image_generation
    capacity: 1
  - name: social
    description: >
      Long-form and social copy. Also posts after a human gate. This fleet
      has no separate browser operator, so social holds browser_operation too.
    capabilities:
      - long_form_writing
      - social_copy
      - social_posting
      - browser_operation
    capacity: 1
  - name: chief-of-staff
    description: Packages deliverables, watches time and cost, and compiles escalations.
    capabilities:
      - packaging
      - monitoring
      - coordination
    capacity: 1
  - name: mastery
    description: Turns logged actuals into better estimates and better instructions.
    capabilities:
      - calibration
      - instruction_review
    capacity: 1
  - name: cloud-worker
    kind: cloud_agent
    description: >
      Cursor cloud agent. Dispatch treats it like a named bot: same brief,
      artifact manifest, and attestation path. capacity is how many of its
      tasks may run at once. cost is the forecast rate, not a live bill.
      coding is implementation work. gpu is a task that needs a GPU.
    capabilities:
      - research
      - synthesis
      - long_form_writing
      - coding
      - gpu
    capacity: 2
    cost:
      usd_per_hour: 1.5
      tokens_per_hour: 50000
  - name: machine-pool
    description: >
      Generic shared pool of machines, one job per machine. capacity is how
      many of those jobs may run at once. CPU work stays on the other roles.
    capabilities:
      - coding
      - gpu
    capacity: 4
